<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal MAREM</title>
  <meta name="theme-color" content="#030914">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portal MAREM">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://i.ibb.co/rff7smrH/Logo-Inversiones-Marem.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #0c264a 0%, #030914 60%, #010308 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .launcher-card {
      width: 100%;
      max-width: 380px;
      background: rgba(8, 25, 52, 0.88);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.85), 0 0 30px rgba(56,189,248,0.2);
    }
    .logo { max-width: 210px; margin-bottom: 18px; filter: drop-shadow(0 0 16px rgba(56,189,248,0.5)); }
    h1 { font-size: 1.15rem; letter-spacing: 1px; color: #e0f2fe; margin-bottom: 10px; }
    p { font-size: 0.88rem; color: #bae6fd; line-height: 1.45; margin-bottom: 20px; }
    .btn-primary-marem {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 999px;
      border: 1.5px solid #7dd3fc;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.5);
      margin-bottom: 12px;
    }
    .btn-secondary-marem {
      display: none;
      width: 100%;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1.5px dashed rgba(56, 189, 248, 0.65);
      background: rgba(6, 22, 46, 0.8);
      color: #bae6fd;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      margin-top: 6px;
    }
    .ios-box {
      display: none;
      text-align: left;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(56,189,248,0.3);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: #e0f2fe;
      margin-top: 12px;
      line-height: 1.45;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(56,189,248,0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="launcher-card" id="cardLauncher">
    <img src="https://i.ibb.co/rff7smrH/Logo-Inversiones-Marem.png" alt="Inversiones MAREM" class="logo">
    <div id="spinnerCarga" class="spinner" style="display:none;"></div>
    <h1 id="tituloEstado">PORTAL MAREM</h1>
    <p id="textoEstado">Accede al sistema o instala el ícono directo en la pantalla de tu celular.</p>

    <a id="btnEntrarDirecto" href="#" class="btn-primary-marem">INGRESAR AL PORTAL</a>

    <button id="btnInstalarPwa" type="button" class="btn-secondary-marem">
      📲 Instalar App en mi Celular
    </button>

    <button id="btnAbrirEnChrome" type="button" class="btn-secondary-marem">
      🌐 Abrir en Google Chrome para Instalar
    </button>

    <div id="guiaIos" class="ios-box">
      <strong>Para instalar en iPhone / iPad:</strong><br>
      1. Toca el botón <strong>Compartir (⬆️)</strong> en la barra de Safari.<br>
      2. Elige <strong>"Agregar a Inicio"</strong> y pulsa <strong>Agregar</strong>.
    </div>
  </div>

  <script>
    // URL oficial exacta + parámetro anti-conflicto de cuentas Android
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxbT0DiVweDlPRURxLC_FFQ2E3XwQkkwaeF8tgiCikn_8N8zkbW4wVfGqnD88Msydy2kA/exec?authuser=0";

    const btnEntrar = document.getElementById("btnEntrarDirecto");
    const btnInstalar = document.getElementById("btnInstalarPwa");
    const btnAbrirChrome = document.getElementById("btnAbrirEnChrome");
    const guiaIos = document.getElementById("guiaIos");
    const spinner = document.getElementById("spinnerCarga");
    const titulo = document.getElementById("tituloEstado");
    const texto = document.getElementById("textoEstado");

    btnEntrar.href = URL_APPS_SCRIPT;

    const ua = navigator.userAgent || "";
    const esIos = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const esAndroid = /Android/i.test(ua);
    const esVisorInterno = /FBAN|FBAV|Instagram|WhatsApp|wv|Gmail/i.test(ua);
    const enStandalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
    const params = new URLSearchParams(window.location.search);
    const pidioInstalar = params.get("instalar") === "1";

    // Si abre desde el ícono ya instalado en el celular, salta directo al Portal
    if (enStandalone && !pidioInstalar) {
      spinner.style.display = "block";
      titulo.textContent = "ABRIENDO SISTEMA...";
      texto.textContent = "Conectando con Portal MAREM...";
      btnEntrar.style.display = "none";
      window.location.replace(URL_APPS_SCRIPT);
    } else {
      if (esAndroid && esVisorInterno) {
        btnAbrirChrome.style.display = "block";
        btnAbrirChrome.onclick = function() {
          window.location.href = "intent://nmejia-ux.github.io/portal-marem/?instalar=1#Intent;scheme=https;package=com.android.chrome;end";
        };
      } else if (esIos && !enStandalone) {
        guiaIos.style.display = "block";
      }
    }

    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredPrompt = e;
      if (!enStandalone) {
        btnInstalar.style.display = "block";
      }
    });

    btnInstalar.addEventListener("click", async function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      btnInstalar.style.display = "none";
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=5").then(function(reg) {
        reg.update();
      }).catch(function() {});
    }
  </script>
</body>
</html>
