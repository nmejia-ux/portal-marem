<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Portal MAREM</title>
  
  <!-- Configuración PWA Estándar (Android: Xiaomi, Redmi, Samsung, etc.) -->
  <meta name="theme-color" content="#051329">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">

  <!-- Configuración PWA para iOS (iPhone / iPad) con ícono cuadrado exacto 180x180 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Portal MAREM">
  <link rel="apple-touch-icon" sizes="180x180" href="https://wsrv.nl/?url=i.ibb.co/rff7smrH/Logo-Inversiones-Marem.png&w=180&h=180&fit=contain&cbg=051329&output=png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://wsrv.nl/?url=i.ibb.co/rff7smrH/Logo-Inversiones-Marem.png&w=192&h=192&fit=contain&cbg=051329&output=png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #051329;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .iframe-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Botón flotante superior/inferior para instalar la App en cualquier móvil */
    #btnInstalarPWA {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: linear-gradient(135deg, #0077c5, #051329);
      color: #ffffff;
      border: 2px solid #38bdf8;
      border-radius: 999px;
      padding: 11px 22px;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 18px rgba(56, 189, 248, 0.55);
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      animation: pulseBtn 2.5s infinite;
    }

    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 12px rgba(56, 189, 248, 0.4); }
      50% { box-shadow: 0 10px 28px rgba(0, 0, 0, 0.9), 0 0 24px rgba(56, 189, 248, 0.85); }
    }

    /* Modal guía universal para iPhone y Xiaomi/Samsung */
    #modalAyudaPWA {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 20, 0.78);
      backdrop-filter: blur(6px);
      z-index: 100000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }
    #modalAyudaPWA.activo {
      display: flex;
    }
    .pwa-card {
      width: 100%;
      max-width: 390px;
      background: radial-gradient(circle at top, #0f3057 0%, #051329 100%);
      border: 2px solid #38bdf8;
      border-radius: 22px;
      padding: 20px;
      color: #ffffff;
      box-shadow: 0 25px 60px rgba(0,0,0,0.95);
      margin-bottom: 8px;
    }
    .pwa-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
    }
    .pwa-step {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 11px 13px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.45;
    }
    .pwa-btn-close {
      width: 100%;
      background: #38bdf8;
      color: #051329;
      border: none;
      border-radius: 999px;
      padding: 11px;
      font-weight: 800;
      font-size: 13.5px;
      margin-top: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Botón flotante para instalar la App -->
  <button id="btnInstalarPWA" type="button">
    📲 Instalar App Portal MAREM
  </button>

  <!-- Modal de asistencia cuando el navegador requiere instalación desde el menú -->
  <div id="modalAyudaPWA" onclick="if(event.target===this) cerrarModalPWA()">
    <div class="pwa-card">
      <div class="pwa-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <img src="https://i.ibb.co/rff7smrH/Logo-Inversiones-Marem.png" style="height:26px;object-fit:contain;">
          <strong style="color:#38bdf8;font-size:14.5px;">Instalar App Portal MAREM</strong>
        </div>
        <button onclick="cerrarModalPWA()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">✕</button>
      </div>
      <div id="cuerpoPasosPWA"></div>
      <button class="pwa-btn-close" onclick="cerrarModalPWA()">¡Entendido!</button>
    </div>
  </div>

  <div class="iframe-container">
    <iframe 
      id="framePortalMarem"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    // =========================================================================
    // 1. URL DE TU WEBAPP DE GOOGLE APPS SCRIPT (TERMINADA EN /exec)
    // =========================================================================
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxbT0DiVweDlPRURxLC_FFQ2E3XwQkkwaeF8tgiCikn_8N8zkbW4wVfGqnD88Msydy2kA/exec?authuser=0";

    const frame = document.getElementById("framePortalMarem");
    const paramsUrl = new URLSearchParams(window.location.search);
    const pidioInstalar = paramsUrl.get("instalar") === "1";

    // Limpiar el parámetro ?instalar=1 para no ensuciar el iframe
    if (pidioInstalar) {
      paramsUrl.delete("instalar");
      const limpia = window.location.pathname + (paramsUrl.toString() ? "?" + paramsUrl.toString() : "");
      window.history.replaceState({}, document.title, limpia);
    }

    const queryFinal = paramsUrl.toString() ? "?" + paramsUrl.toString() : "";
    frame.src = URL_APPS_SCRIPT + queryFinal;

    // =========================================================================
    // 2. REGISTRO DEL SERVICE WORKER
    // =========================================================================
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function(err) {
          console.warn("Aviso SW:", err);
        });
      });
    }

    // =========================================================================
    // 3. DETECCIÓN DE MÓVIL Y MODO APP INSTALADA (STANDALONE)
    // =========================================================================
    let deferredPrompt = null;
    const btnInstalar = document.getElementById("btnInstalarPWA");

    function esModoAppInstalada() {
      return (window.navigator.standalone === true) ||
             (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    }

    function esIos() {
      const ua = navigator.userAgent || "";
      return /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function esMovil() {
      const ua = navigator.userAgent || "";
      return /Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(ua) || esIos();
    }

    // Mostrar el botón en celulares si aún no está abierta como App instalada
    if (esMovil() && !esModoAppInstalada()) {
      btnInstalar.style.display = "inline-flex";
    }

    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredPrompt = e;
      if (!esModoAppInstalada()) {
        btnInstalar.style.display = "inline-flex";
      }
    });

    function mostrarModalInstrucciones() {
      const cont = document.getElementById("cuerpoPasosPWA");
      const modal = document.getElementById("modalAyudaPWA");
      if (esIos()) {
        cont.innerHTML = ''
          + '<div class="pwa-step"><b>Paso 1:</b> Toca el botón <b>Compartir (📤)</b> en la barra inferior o superior de Safari/Chrome en tu iPhone.</div>'
          + '<div class="pwa-step"><b>Paso 2:</b> Desliza hacia abajo y toca en <b>"Agregar a Inicio"</b> y luego confirma en <b>Agregar</b>.</div>';
      } else {
        cont.innerHTML = ''
          + '<div class="pwa-step"><b>Paso 1:</b> Toca los <b>3 puntitos (⋮)</b> en la esquina superior derecha de tu navegador Chrome.</div>'
          + '<div class="pwa-step"><b>Paso 2:</b> Toca en <b>"Instalar aplicación"</b> (o <b>"Agregar a la pantalla principal"</b>) y presiona <b>Instalar</b>.</div>'
          + '<div class="pwa-step" style="border-color:#fbbf24;background:rgba(251,191,36,0.1);">💡 <b>Nota para Xiaomi / Redmi:</b> Si no ves el ícono en tu pantalla, ve a <i>Configuración > Aplicaciones > Chrome > Otros permisos</i> y activa <b>"Accesos directos en la pantalla de inicio"</b>.</div>';
      }
      modal.classList.add("activo");
    }

    function cerrarModalPWA() {
      document.getElementById("modalAyudaPWA").classList.remove("activo");
    }

    btnInstalar.addEventListener("click", async function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === "accepted") {
          btnInstalar.style.display = "none";
        }
        deferredPrompt = null;
      } else {
        mostrarModalInstrucciones();
      }
    });

    window.addEventListener("appinstalled", function() {
      btnInstalar.style.display = "none";
      deferredPrompt = null;
    });

    // Si vino redirigido desde el botón de adentro del Login (?instalar=1), abrir asistente
    if (pidioInstalar && !esModoAppInstalada()) {
      setTimeout(function() {
        btnInstalar.click();
      }, 900);
    }
  </script>
</body>
</html>
